name: Refresh and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m unittest discover -s tests
      - name: Refresh and preserve nightly fix history
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.token || '' }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            bash scripts/refresh_nightly_history.sh --publish
          else
            bash scripts/refresh_nightly_history.sh
          fi
      - run: python scripts/build_data.py --max-pages 200
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
